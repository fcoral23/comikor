<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cómic Interactivo</title>
    
    <style>
        /* El CSS base se mantiene igual */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
            color: #fff;
        }

        #visor-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .comic-img {
            width: 100%;
            max-width: 800px;
            height: auto;
            display: block;
        }

        .pantalla-efecto {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 800px;
            height: 100vh;
            background-size: cover;
            background-position: top center;
            z-index: 10;
            pointer-events: none;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease;
        }

        .arranque-arriba {
            clip-path: polygon(0% 0%, 100% 0%, 100% 48%, 85% 52%, 70% 47%, 55% 53%, 40% 48%, 25% 52%, 10% 46%, 0% 50%);
        }

        .arranque-abajo {
            clip-path: polygon(0% 50%, 10% 46%, 25% 52%, 40% 48%, 55% 53%, 70% 47%, 85% 52%, 100% 48%, 100% 100%, 0% 100%);
        }

        .animar-arriba {
            transform: translate(-50%, -60vh) rotate(-2deg);
            opacity: 0;
        }

        .animar-abajo {
            transform: translate(-50%, 60vh) rotate(2deg);
            opacity: 0;
        }

        #popup-decisiones {
            position: fixed;
            bottom: -200px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.95);
            border: 3px solid #fff;
            padding: 20px;
            width: 90%;
            max-width: 600px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            z-index: 5;
            transition: bottom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #popup-decisiones.activo {
            bottom: 40px;
        }

        .titulo-popup {
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ccc;
        }

        .opcion-btn {
            background: #222;
            color: #fff;
            border: 2px solid #555;
            padding: 12px 20px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 5px;
            transition: all 0.2s ease;
            width: 100%;
            font-family: inherit;
        }

        .opcion-btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .tecla-indicador {
            background: #444;
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            border-bottom: 3px solid #222;
            text-transform: uppercase;
        }

        .opcion-btn:hover .tecla-indicador {
            background: #000;
            color: #fff;
            border-bottom-color: #333;
        }

        #final-pagina {
            width: 100%;
            height: 50px;
        }
    </style>
</head>
<body>

    <div id="visor-container">
        <img id="comic-actual" class="comic-img" src="" alt="Cargando escena...">
        <div id="final-pagina"></div>
    </div>

    <div id="popup-decisiones">
        <div class="titulo-popup">¿Qué vas a hacer?</div>
        <div id="contenedor-botones"></div>
    </div>

    <!-- ======================================================== -->
    <!-- AQUÍ SE CORRIGIÓ: Se añadió la etiqueta <script> correcta -->
    <!-- ======================================================== -->
    <script>
        // CONFIGURACIÓN DEL ÁRBOL DE DECISIONES
        const historia = {
            "1": {
                archivo: "1.jpg", 
                opciones: [
                    { texto: "La leo al rato", destino: "2.1" },
                    { texto: "La leo ahora", destino: "2.2" }
                ]
            },
            "2.1": {
                archivo: "2.1.jpg",
                opciones: [
                    { texto: "Dejar a Kory leer la carta", destino: "3.1" },
                    { texto: "Quitarle la carta a Kory", destino: "3.2" }
                ]
            },
            "2.2": {
                archivo: "2.2.jpg",
                opciones: []
            },
            "3.1": {
                archivo: "3.1.jpg",
                opciones: []
            },
            "3.2": {
                archivo: "3.2.jpg",
                opciones: [
                    { texto: "Dejar la carta para el día siguiente", destino: "4.1" },
                    { texto: "Aprovechar que se distraiga Kory para leerla", destino: "4.2" }
                ]
            },
            "4.1": {
                archivo: "4.1.jpg",
                opciones: []
            },
            "4.2": {
                archivo: "4.2.jpg",
                opciones: []
            }
        };

        const mapeoFlechas = {
            1: ["ArrowDown"],
            2: ["ArrowLeft", "ArrowRight"],
            3: ["ArrowLeft", "ArrowDown", "ArrowRight"]
        };

        const nombresFlechas = {
            "ArrowLeft": "◄ Izq",
            "ArrowRight": "Der ►",
            "ArrowDown": "▼ Abajo"
        };

        let nodoActual = "1"; 
        let opcionesActivas = [];
        let bloquearObserver = true; 

        const imgElement = document.getElementById("comic-actual");
        const popup = document.getElementById("popup-decisiones");
        const contenedorBotones = document.getElementById("contenedor-botones");
        const finalPagina = document.getElementById("final-pagina");

        function cargarNodo(idNodo) {
            nodoActual = idNodo;
            const datosNodo = historia[idNodo];

            popup.classList.remove("activo");
            bloquearObserver = true; 

            imgElement.src = `assets/${datosNodo.archivo}`;
            window.scrollTo(0, 0);

            opcionesActivas = datosNodo.opciones.map((opc, index) => {
                const totalOpciones = datosNodo.opciones.length;
                const teclaAsignada = mapeoFlechas[totalOpciones] ? mapeoFlechas[totalOpciones][index] : null;
                return { ...opc, tecla: teclaAsignada };
            });

            contenedorBotones.innerHTML = "";
            
            if (opcionesActivas.length === 0) {
                contenedorBotones.innerHTML = "<p style='text-align:center; color:#ff4444; font-weight:bold;'>FIN DE LA AVENTURA</p>";
            } else {
                opcionesActivas.forEach(opc => {
                    const btn = document.createElement("button");
                    btn.className = "opcion-btn";
                    
                    const textoTecla = nombresFlechas[opc.tecla] || "Click";
                    btn.innerHTML = `
                        <span>${opc.texto}</span>
                        <span class="tecla-indicador">${textoTecla}</span>
                    `;
                    
                    btn.onclick = () => procesarDecision(opc.destino);
                    contenedorBotones.appendChild(btn);
                });
            }
        }

        imgElement.onload = () => {
            setTimeout(() => {
                bloquearObserver = false;
            }, 100);
        };

        function procesarDecision(destino) {
            const datosNodoActual = historia[nodoActual];
            const rutaImagenActual = `assets/${datosNodoActual.archivo}`;

            const capaArriba = document.createElement("div");
            const capaAbajo = document.createElement("div");

            capaArriba.className = "pantaya-efecto arranque-arriba"; // Mantenido la clase de tu CSS
            capaArriba.className = "pantalla-efecto arranque-arriba";
            capaAbajo.className = "pantalla-efecto arranque-abajo";

            capaArriba.style.backgroundImage = `url('${rutaImagenActual}')`;
            capaAbajo.style.backgroundImage = `url('${rutaImagenActual}')`;

            document.body.appendChild(capaArriba);
            document.body.appendChild(capaAbajo);

            cargarNodo(destino);

            setTimeout(() => {
                capaArriba.classList.add("animar-arriba");
                capaAbajo.classList.add("animar-abajo");
            }, 50);

            setTimeout(() => {
                capaArriba.remove();
                capaAbajo.remove();
            }, 650);
        }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (bloquearObserver) return; 

                if (entry.isIntersecting) {
                    popup.classList.add("activo");
                }
            });
        }, { threshold: 0.1 });

        observer.observe(finalPagina);

        window.addEventListener("keydown", (e) => {
            if (!popup.classList.contains("activo")) return;

            const opcionSeleccionada = opcionesActivas.find(opc => opc.tecla === e.key);
            
            if (opcionSeleccionada) {
                e.preventDefault(); 
                procesarDecision(opcionSeleccionada.destino);
            }
        });

        window.onload = () => {
            cargarNodo("1");
        };
    </script>
</body>
</html>
